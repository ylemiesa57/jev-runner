# Tag a version and the installer binaries appear on a GitHub Release:
#   git tag v0.1.0 && git push --tags
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest   # pure-Go cross-compile; no Mac runner needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build both Mac architectures
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/jev-runner-setup-darwin-$arch" ./cmd/jev-runner-setup
          done
          (cd dist && shasum -a 256 * > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "Jev Runner ${GITHUB_REF_NAME}" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sh\`"
